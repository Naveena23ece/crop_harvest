services:
  - type: web
    name: grainguard-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 720
      - key: GRAINGUARD_ADMIN_USER
        value: Naveena
      - key: GRAINGUARD_ADMIN_PASS
        value: 2004
      - key: GRAINGUARD_ADMIN_EMAIL
        value: naveena@grainguard.local
      - key: GRAINGUARD_VIEWER_USER
        value: viewer
      - key: GRAINGUARD_VIEWER_PASS
        value: viewer2026
      - key: GRAINGUARD_VIEWER_EMAIL
        value: viewer@grainguard.local
